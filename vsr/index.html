<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNN Sample App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #569cd6;
        }
        .section {
            background-color: #2d2d2d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
        }
        .section h3 {
            margin-top: 0;
            color: #4ec9b0;
        }
        label {
            display: block;
            margin: 10px 0 5px 0;
            color: #9cdcfe;
        }
        select, input[type="file"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background-color: #3c3c3c;
            border: 1px solid #505050;
            color: #d4d4d4;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0e639c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1177bb;
        }
        button:disabled {
            background-color: #505050;
            cursor: not-allowed;
        }
        #log {
            background-color: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .log-info { color: #d4d4d4; }
        .log-success { color: #4ec9b0; }
        .log-error { color: #f14c4c; }
        .log-warn { color: #cca700; }
        .log-timing { color: #569cd6; }
        #modelInfo {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            margin-top: 15px;
            padding: 10px;
            background-color: #252526;
            border-radius: 4px;
            min-height: 20px;
        }
        #modelInfo h4 {
            margin: 0 0 10px 0;
            color: #4ec9b0;
        }
        #modelInfo ul {
            margin: 5px 0;
            padding-left: 20px;
        }
        #modelInfo li {
            color: #ce9178;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-row input {
            flex: 1;
        }
        #imagePreview {
            max-width: 300px;
            max-height: 300px;
            margin-top: 10px;
            border: 1px solid #3c3c3c;
        }
    </style>
</head>
<body>
    <h1>🧠 WebNN Sample App</h1>
    <p>Simple ONNX model inference using ONNX Runtime Web with WebNN Execution Provider</p>
    
    <div class="section">
        <h3>1. Configuration</h3>
        <label for="executionProvider">Execution Provider:</label>
        <select id="executionProvider">
            <option value="webnn">WebNN</option>
            <option value="webgpu">WebGPU</option>
            <option value="wasm">WebAssembly (CPU)</option>
        </select>

        <label for="deviceType">Device Type (WebNN only):</label>
        <select id="deviceType">
            <option value="cpu">CPU</option>
            <option value="gpu">GPU</option>
            <option value="npu">NPU</option>
        </select>

        <label for="powerPreference">Power Preference:</label>
        <select id="powerPreference">
            <option value="default">Default</option>
            <option value="low-power">Low Power</option>
            <option value="high-performance">High Performance</option>
        </select>
        
        <button id="testWebNNBtn">Test WebNN Directly</button>
    </div>

    <div class="section">
        <h3>2. Load Model</h3>
        <label for="modelFile">Select ONNX Model:</label>
        <input type="file" id="modelFile" accept=".onnx">
        <button id="loadModelBtn" disabled>Load Model</button>
        <div id="modelInfo"></div>
    </div>

    <div class="section">
        <h3>3. Run Inference</h3>
        <label for="inputShape">Input Shape (comma-separated):</label>
        <input type="text" id="inputShape" value="1,256,288,3" placeholder="1,256,288,3">
        
        <label for="inputDataType">Input Data Type:</label>
        <select id="inputDataType">
            <option value="uint8" selected>uint8</option>
            <option value="float32">float32</option>
            <option value="int8">int8</option>
            <option value="int32">int32</option>
            <option value="float16">float16</option>
        </select>
        
        <button id="runRandomBtn" disabled>Run with Random Input</button>
        
        <label for="iterations">Benchmark iterations:</label>
        <input type="number" id="iterations" value="10" min="1" max="1000">
        <button id="runBenchmarkBtn" disabled>Run Benchmark</button>
    </div>

    <div class="section">
        <h3>4. Output Log</h3>
        <button id="clearLogBtn">Clear Log</button>
        <div id="log"></div>
    </div>

    <!-- ONNX Runtime Web (full bundle with WebNN support) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.1/dist/ort.all.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
